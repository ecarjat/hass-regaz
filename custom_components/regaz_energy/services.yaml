import_daily_history:
  name: Import daily consumption history
  description: Import complete REGAZ daily data as separate gas and energy statistics. Repeating the action updates revised estimates.
  fields:
    entry_id:
      required: true
      example: "0123456789abcdef0123456789abcdef"
      selector:
        config_entry:
          integration: regaz_energy
    start_date:
      required: true
      example: "2026-10-01"
      selector:
        date:
    end_date:
      required: true
      example: "2026-10-31"
      selector:
        date:
